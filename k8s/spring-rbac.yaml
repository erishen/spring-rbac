# ============================================================
# Spring RBAC on k3s（单节点 / OrbStack 友好）
# ------------------------------------------------------------
# 前提：镜像已存在于节点本地（make k3s-build = docker compose build，
#       产出 spring-rbac/<svc>:latest；OrbStack 下 k3s 可直接看到 docker 镜像）。
# 部署：kubectl apply -f k8s/spring-rbac.yaml
# 清理：kubectl delete -f k8s/spring-rbac.yaml
#
# 设计：与裸 jar / compose 完全是同一套代码，地址通过 env 注入，不改任何 application.yml。
#   - Eureka/Config 地址用 K8s Service 名（eureka-server / config-server）
#   - 实例注册 prefer-ip-address=true（注册 Pod IP，K8s 网络内互通）
#   - 网关 lb://auth-service 经 Eureka 拿到 Pod IP 后直连
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: rbac-demo
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: spring-rbac/eureka-server:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-Xmx256m", "-jar", "app.jar"]
          ports:
            - containerPort: 8761
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: rbac-demo
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: rbac-demo
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: spring-rbac/config-server:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-Xmx256m", "-jar", "app.jar"]
          ports:
            - containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: rbac-demo
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rbac-demo
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-config
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "100m"
          command:
            - sh
            - -c
            - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
      containers:
        - name: auth-service
          image: spring-rbac/auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-Xmx256m", "-jar", "app.jar"]
          ports:
            - containerPort: 4101
          env:
            # 说明：eureka.client.serviceUrl 是 Map 类型，扁平 env 变量无法可靠绑定，
            # 故用 JVM 系统属性（最高优先级）经 JAVA_TOOL_OPTIONS 注入。
            - name: JAVA_TOOL_OPTIONS
              value: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Deureka.instance.prefer-ip-address=true -Dspring.config.import=optional:configserver:http://config-server:8888"
          readinessProbe:
            tcpSocket:
              port: 4101
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4101
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rbac-demo
spec:
  selector:
    app: auth-service
  ports:
    - port: 4101
      targetPort: 4101
  type: ClusterIP
---
