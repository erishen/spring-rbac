---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: rbac-demo
  labels:
    app: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      initContainers:
        - name: wait-config
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "100m"
          command:
            - sh
            - -c
            - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
      containers:
        - name: customer-service
          image: spring-rbac/customer-service:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-Xmx256m", "-jar", "app.jar"]
          ports:
            - containerPort: 4103
          env:
            # 说明：eureka.client.serviceUrl 是 Map 类型，扁平 env 变量无法可靠绑定，
            # 故用 JVM 系统属性（最高优先级）经 JAVA_TOOL_OPTIONS 注入。
            - name: JAVA_TOOL_OPTIONS
              value: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Deureka.instance.prefer-ip-address=true -Dspring.config.import=optional:configserver:http://config-server:8888"
          readinessProbe:
            tcpSocket:
              port: 4103
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4103
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: rbac-demo
spec:
  selector:
    app: customer-service
  ports:
    - port: 4103
      targetPort: 4103
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: rbac-demo
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      initContainers:
        - name: wait-config
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "100m"
          command:
            - sh
            - -c
            - until nc -z config-server 8888 && nc -z auth-service 4101 && nc -z rbac-service 4102 && nc -z customer-service 4103; do echo "waiting for config/auth/rbac/customer"; sleep 2; done
      containers:
        - name: gateway-service
          image: spring-rbac/gateway-service:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 5 && exec java -Xmx256m -jar app.jar"]
          ports:
            - containerPort: 4100
          env:
            # 说明：eureka.client.serviceUrl 是 Map 类型，扁平 env 变量无法可靠绑定，
            # 故用 JVM 系统属性（最高优先级）经 JAVA_TOOL_OPTIONS 注入。
            - name: JAVA_TOOL_OPTIONS
              value: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Deureka.instance.prefer-ip-address=true -Dspring.config.import=optional:configserver:http://config-server:8888"
          readinessProbe:
            tcpSocket:
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4100
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: rbac-demo
spec:
  selector:
    app: gateway-service
  ports:
    - port: 4100
      targetPort: 4100
      nodePort: 30410
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rbac-demo
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-gateway
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "100m"
          command:
            - sh
            - -c
            - until nc -z gateway-service 4100; do echo "waiting for gateway-service"; sleep 2; done
      containers:
        - name: web
          image: spring-rbac/web:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start"]
          ports:
            - containerPort: 3000
          env:
            # 容器网络内网关即 gateway-service:4100（rewrite 目标构建期已烤进镜像，此处仅显式声明）
            - name: BACKEND_URL
              value: "http://gateway-service:4100"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rbac-demo
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
