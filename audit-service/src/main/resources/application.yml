server:
  port: 4104

spring:
  application:
    name: audit-service
  config:
    import: optional:configserver:http://localhost:8888
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
    instance:
      prefer-ip-address: true
      ip-address: 127.0.0.1

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: OFF
